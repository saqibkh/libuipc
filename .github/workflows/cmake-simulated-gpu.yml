name: cmake-simulated-gpu

# cmake.yml builds the CUDA backend but runs only the CPU tests, since
# GitHub's runners have no GPU. PantheonSim simulates an NVIDIA L4 (sm_89, the
# architecture the build targets) on the runner's CPU, so the CUDA backend's
# unit tests (uipc.backend_cuda) run here. It checks results, not speed; a
# real GPU is still the final word.
on:
  push:
    branches:
      - "main"
      - "ci-simulated-gpu"
    paths-ignore:
      - ".clang-format"
      - ".clangd"
      - ".cursor/**"
      - ".gitignore"
      - "LICENSE"
      - "README.md"
      - "docs/**"
      - "agent_docs/**"
      - "**/xmake.lua"
      - ".github/workflows/xmake.yml"
      - ".github/workflows/docs.yml"
      - ".github/workflows/python-wheels.yml"
  pull_request:
    branches:
      - "main"
    paths-ignore:
      - ".clang-format"
      - ".clangd"
      - ".cursor/**"
      - ".gitignore"
      - "LICENSE"
      - "README.md"
      - "docs/**"
      - "agent_docs/**"
      - "**/xmake.lua"
      - ".github/workflows/xmake.yml"
      - ".github/workflows/docs.yml"
      - ".github/workflows/python-wheels.yml"
  workflow_dispatch:

# The job reads the repository and nothing else. The simulator's action uses
# no token or secrets, and installs packages only from Ubuntu and NVIDIA.
permissions:
  contents: read

jobs:
  backend-cuda-tests:
    runs-on: ubuntu-22.04

    concurrency:
      group: ${{ github.ref }}-${{ github.base_ref }}-${{ github.head_ref }}-cmake-simulated-gpu
      cancel-in-progress: true

    steps:
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@8831c82abf29b34eb2caac48d5f999ecfc0d8eef # v4.1
        with:
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"

      # Replaces the CUDA toolkit step of cmake.yml: it installs CUDA 12.8 and
      # simulates the GPU.
      - name: Simulated GPU (NVIDIA L4) and CUDA 12.8
        uses: pantheongpu/pantheonsim@0bd1dd1269895552f69e61beacb1d052503198f5 # pantheonsim 335 + 336, rehearsal
        with:
          gpu: nvidia/l4
          cuda-toolkit: '12.8'
          library-path: false

      - name: Setup ninja
        run: |
          sudo apt update
          sudo apt install ninja-build

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true

      - name: Generate vcpkg.json
        run: |
          cmake -E make_directory "${{ github.workspace }}/build"
          python scripts/gen_vcpkg_json.py "${{ github.workspace }}/build" --with_cuda_backend=ON

      - name: Setup vcpkg
        id: vcpkg
        uses: johnwason/vcpkg-action@7c4b562bb35ef5a01d9d728acc90100b107dee4d # v6
        with:
          manifest-dir: "${{ github.workspace }}/build"
          triplet: x64-linux
          cache-key: ubuntu-22.04
          revision: dd3097e305afa53f7b4312371f62058d2e665320 # 2025.07.25
          token: ${{ github.token }}
          github-binarycache: true
          fetch-depth: "0"

      - name: Restore the build
        id: build-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/build
          key: libuipc-build-${{ github.sha }}

      # The simulator stands in for the CUDA runtime at run time, so the
      # shared one is linked.
      - name: Build libuipc
        env:
          CMAKE_TOOLCHAIN_FILE: "${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake"
        run: |
          cmake -S ${{ github.workspace }} -B ${{ github.workspace }}/build --preset ci-release \
            -DUIPC_CUDA_ARCHITECTURES=89 -DCMAKE_CUDA_RUNTIME_LIBRARY=Shared \
            -DUIPC_BUILD_BENCHMARKS=OFF -DUIPC_BUILD_EXAMPLES=OFF
          cmake --build ${{ github.workspace }}/build --preset ci-release --parallel 4

      - name: List the CUDA backend test cases
        run: |
          B="$(find "${{ github.workspace }}/build" -name backend_cuda -type f | head -n 1)"
          echo "$B"
          cd "${{ github.workspace }}"
          "$B" --list-tests

      - name: Run the CUDA backend tests on the simulated GPU, with durations
        continue-on-error: true
        run: |
          B="$(find "${{ github.workspace }}/build" -name backend_cuda -type f | head -n 1)"
          cd "${{ github.workspace }}"
          timeout 5400 vgpu run "$B" --durations yes --reporter compact
